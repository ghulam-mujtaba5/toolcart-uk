<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="hiVisLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9F99D"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <linearGradient id="ppeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <style>
      .goggle-float { animation: gogFloat 3.6s ease-in-out infinite; }
      .mask-float { animation: mskFloat 4.1s ease-in-out infinite; }
      .ear-float { animation: earFloat 3.9s ease-in-out infinite; }
      @keyframes gogFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      @keyframes mskFloat { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-8px) scale(1.02); } }
      @keyframes earFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
    </style>
  </defs>
  <ellipse cx="360" cy="250" rx="195" ry="72" fill="#EFF6FF"/>
  <ellipse cx="360" cy="250" rx="140" ry="50" fill="#DBEAFE" opacity="0.65"/>
  <!-- 3D EN166 Wrap-Around Safety Goggles -->
  <g class="goggle-float" filter="url(#shadow5)">
    <path d="M165,165 L235,125 C248,118 260,122 268,132 L255,142 L180,185 Z" fill="url(#ppeBlue)"/>
    <path d="M295,145 L355,112 C368,106 380,112 385,124 L310,165 Z" fill="url(#ppeBlue)"/>
    <path d="M155,172 C195,148 275,148 318,172 L312,222 C288,236 268,232 252,212 C238,200 228,202 215,218 C195,235 172,232 155,215 Z" fill="url(#lensGrad)" stroke="#38BDF8" stroke-width="3"/>
    <path d="M152,170 C195,144 275,144 320,170" fill="none" stroke="url(#ppeBlue)" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- 3D FFP3 Valved Dust Respirator Mask -->
  <g class="mask-float" filter="url(#shadow5)">
    <ellipse cx="375" cy="225" rx="68" ry="48" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5"/>
    <path d="M320,215 C350,185 400,185 430,215" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="360" y="198" width="32" height="28" rx="8" fill="url(#ppeBlue)"/>
    <circle cx="376" cy="212" r="9" fill="#93C5FD"/>
  </g>
  <!-- 3D High-Vis Ear Defenders -->
  <g class="ear-float" filter="url(#shadow5)">
    <path d="M455,165 C455,75 565,75 565,165" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
    <path d="M455,165 C455,82 565,82 565,165" fill="none" stroke="url(#ppeBlue)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="455" cy="182" rx="22" ry="38" fill="url(#hiVisLime)" stroke="#4D7C0F" stroke-width="2"/>
    <ellipse cx="462" cy="182" rx="14" ry="28" fill="#1E293B"/>
    <ellipse cx="565" cy="182" rx="22" ry="38" fill="url(#hiVisLime)" stroke="#4D7C0F" stroke-width="2"/>
    <ellipse cx="558" cy="182" rx="14" ry="28" fill="#1E293B"/>
  </g>
</svg>